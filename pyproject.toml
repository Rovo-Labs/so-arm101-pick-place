[project]
name = "so-arm101-pick-place"
version = "1.0.0"
description = "A MuJoCo reconstruction of the GPU-DAD SO-101 pick-cube scene."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # mujoco 3.12 shifts the floor checker texture, which moves every rendered
    # pixel. The upper bound is what keeps run.py's output identical to
    # figures/reconstruction_3views.png -- do not relax it without re-checking
    # the render against that figure.
    "mujoco>=3.10,<3.12",
    "pillow>=10.1",
    "glfw>=2.6",
    # ik_expert.py imports numpy directly. MuJoCo already requires it, so this
    # pins nothing new -- it just declares what we actually import.
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Rovo-Labs/so-arm101-pick-place"

# There is deliberately no [build-system] table: this repository is a world and
# one script, not an importable package, so there is no wheel to build. uv then
# treats it as a virtual project -- it installs the dependencies above into
# .venv and never tries to install the repository itself. Adding a
# [build-system] is the classic trap for asset repos: uv would try to build a
# wheel and fail. package = false changes nothing today; it is here so that
# adding a [build-system] later cannot silently turn this into a package.
[tool.uv]
package = false

# Read only by `pip install .`, which falls back to setuptools. Without it,
# setuptools mistakes assets/ and figures/ for Python packages and refuses with
# "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools]
py-modules = []
